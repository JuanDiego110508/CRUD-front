<div class="card">

    <h3>
        📦 {{ product.nombre }}
    </h3>

    <p>
        💰 ${{ product.precio }}
    </p>

    <div class="actions">
        <button (click)="editarProducto()">
            Editar
        </button>
        <button (click)="eliminarProducto()">
            Eliminar
        </button>
    </div>
</div>
